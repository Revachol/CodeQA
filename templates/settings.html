{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
  <section class="col vh-100">
    <div class="login">
      <div class="d-flex align-items-center gap-2 mb-4">
        <h1>Settings: Dr. Perpper</h1>
      </div>
      <div class="mb-3 row">
        <label for="staticEmail" class="col-sm-2 col-form-label">Login</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" id="" placeholder="dr_pepper" value="" />
        </div>
      </div>
      <div class="mb-3 row">
        <label for="staticEmail" class="col-sm-2 col-form-label">Email</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" id="]" placeholder="email@example.com" />
        </div>
      </div>
      <div class="mb-3 row">
        <label for="staticEmail" class="col-sm-2 col-form-label">NickName</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" id="" placeholder="Dr.Pepper" />
        </div>
      </div>
      <div class="mb-3 row d-flex">
        <label for="avatarUpload" class="col-sm-2 col-form-label">Upload avatar</label>
        <div class="col-sm-10 align-items-center gap-2">
          <div class="mt-2">
            <img src="" class="border border-light" style="height: 100px; width: 100px;" alt="" />
          </div>
          <div class="d-flex gap-3 mt-2">
            <input type="text" class="form-control w-50" id="avatarPath" placeholder="No file chosen" readonly />
            <label class="btn btn-outline-primary mb-0">Choose<input type="file" id="avatarUpload" class="d-none" accept="image/*" /></label>
          </div>
        </div>
      </div>
      <div class="mb-3 row">
        <div class="col-sm-10 offset-sm-2">
          <button type="button" class="btn text-light custom-btn-bg">Save</button>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
