{% load static %}
<nav aria-label="Page navigation example" class="mt-2">
  <ul class="pagination">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link custom-bg-card" style="color: #89e193;" href="?page={{ page_obj.previous_page_number }}">Previous</a>
      </li>
    {% endif %}
    <li class="page-item">
      <a class="page-link custom-bg-card" style="color: #89e193;" href="#">{{ page_obj.number }}</a>
    </li>
    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link custom-bg-card" style="color: #89e193;" href="?page={{ page_obj.next_page_number }}">Next</a>
      </li>
    {% endif %}
  </ul>
</nav>
