<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ask</title>
    <link href="css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="custom.css">
  </head>
  <body class="text-light custom-bg-main">  
    <nav class="navbar navbar-expand-lg custom-bg-navbar">
        <div class="container">
            <a class="navbar-brand text-light fs-2" href="#">CodeQA</a>

            <form class="d-flex w-50" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Ask</button>
            </form>

            <div class="d-flex gap-2 align-items-center">
                <div>
                    <img src="hello.jpg" class="img-fluid rounded-circle" alt="...">
                </div>
                <div class="content">
                    <div class="content__name ">Dr. Pepper</div>
                    <div class="content__links">
                        <a href="#">Settings</a>
                        <a href="#">Log out</a>
                    </div>
                </div>
            </div>

        </div>
    </nav>
    <main class="container mt-2">
        <div class="row">   
            <section class="col vh-100">
                <div class="ask">
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <h1>New Questions</h1>
                    </div>
                    <div class="title d-flex justify-content-center align-items-center gap-5 mb-3">
                        <label for="" class = "fs-3 col-1">Title</label>
                        <textarea name="" id="" placeholder="Enter title of question" class = "form-control w-75" style="height: 30px;"></textarea>
                    </div>
                    <div class="text d-flex justify-content-center gap-5 mb-3">
                        <label for="" class = "fs-3 col-1">Text</label>
                        <textarea name="" id="" placeholder="Type your question" class = "form-control w-75" style="height: 150px;"></textarea>
                    </div> 
                    <div class="title d-flex justify-content-center align-items-center gap-5 mb-3">
                        <label for="" class = "fs-3 col-1">Tags</label>
                        <textarea name="" id="" placeholder="c++, python" class = "form-control w-75" style="height: 30px;"></textarea>
                    </div>
                    <div class="w-100">
                        <button class="btn btn-outline-success" style="margin-left: 60px;" type="submit">Ask</button>
                    </div>
                </div>
            </section>
            <aside class="col-3">
                <section class="mb-3">
                    <h3>Popular tags</h3>
                    <div>
                        <span class="badge rounded-pill text-bg-primary">Primary</span>
                        <span class="badge rounded-pill text-bg-secondary">Secondary</span>
                        <span class="badge rounded-pill text-bg-success">Success</span>
                        <span class="badge rounded-pill text-bg-danger">Danger</span>
                        <span class="badge rounded-pill text-bg-warning">Warning</span>
                        <span class="badge rounded-pill text-bg-info">Info</span>
                        <span class="badge rounded-pill text-bg-light">Light</span>
                        <span class="badge rounded-pill text-bg-dark">Dark</span>
                    </div>
                </section>

                <section>
                    <h3>Best members</h3>
                    <div>
                        <a class="d-block" href="#">Member</a>
                        <a class="d-block" href="#">Member</a>
                        <a class="d-block" href="#">Member</a>
                        <a class="d-block" href="#">Member</a>
                        <a class="d-block" href="#">Member</a>
                        <a class="d-block" href="#">Member</a>
                        <a class="d-block" href="#">Member</a>
                    </div>
                </section>

            </aside>
        </div>
    </main>
    <script src="js/bootstrap.js"></script>
  </body>
</html>
